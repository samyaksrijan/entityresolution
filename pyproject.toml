[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-entity-resolution"
version = "0.1.0"
description = "Leakage-safe tooling for the ML Challenge 2026 business entity-resolution task."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "catboost",
  "joblib",
  "matplotlib",
  "numpy",
  "pandas",
  "psutil",
  "pyarrow",
  "pyyaml",
  "rapidfuzz",
  "scikit-learn",
  "scipy",
  "seaborn",
  "sparse-dot-topn==1.2.0",
]

[project.optional-dependencies]
dev = [
  "mypy",
  "pytest",
  "pytest-cov",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
